[package]
name = "stalk-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12"
actix-web-httpauth = "0.8.2"
actix-ws = "0.4"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-async-std-native-tls", "sqlite", "migrate"] }
log = "0.4"
env_logger = "0.11.9"
clap = { version = "4.5", features = ["derive"] }
unicode-normalization = "0.1"
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
utoipa-rapidoc = { version = "6", features = ["actix-web"] }
tokio = { version = "1", features = ["sync", "macros"] }
futures-util = "0.3"
serde_json = "1"

[dev-dependencies]
serde_json = "1.0"
awc = "3"

[profile.release]
opt-level = 3
lto = "thin"         # consider true for max perf if you accept slow links
codegen-units = 1
panic = "abort"
strip = true
debug = 0

