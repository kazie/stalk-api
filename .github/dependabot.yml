version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # utoipa-swagger-ui/utoipa-rapidoc share utoipa's OpenApi type, so they must move in lockstep.
      utoipa:
        applies-to: version-updates
        patterns:
          - "utoipa*"
      non-major:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      non-major:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
