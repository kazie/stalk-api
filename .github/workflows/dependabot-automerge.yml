name: Dependabot auto-merge

# Dependabot's patch and minor updates, and flake.lock bumps (no semver type), merge by themselves (merge
# commit) once the required checks pass (ruleset "master": Rust's build, Nix's devshell). Anything else
# (majors) is assigned to the repo owner: the assignment is the notification that a person is needed.
# dependabot-attention.yml does the same when a check fails.
on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - id: auto
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.package-ecosystem == 'nix'
        run: gh pr merge --auto --merge "$PR_URL"
      - if: steps.auto.outcome == 'skipped'
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f "assignees[]=$OWNER" --silent
