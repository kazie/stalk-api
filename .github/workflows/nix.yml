name: Nix

# Builds the dev shell, so a flake.lock bump that breaks it fails here.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  devshell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Detect Nix Changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          nix:
            - 'flake.nix'
            - 'flake.lock'
            - '.github/workflows/nix.yml'

    - name: Install Nix
      if: steps.changes.outputs.nix == 'true' || github.event_name == 'push'
      uses: cachix/install-nix-action@v31

    - name: Build dev shell
      if: steps.changes.outputs.nix == 'true' || github.event_name == 'push'
      run: nix develop --command sqlx --version
